version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build:aws
  # Nitro's aws_amplify preset emits the deployment-manifest bundle here;
  # Amplify Hosting serves `static/` and routes the rest to `compute/default`.
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
